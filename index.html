<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HROD Training Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Tahoma", sans-serif; background: #f5f6fa; color: #1f2937; }
    .header { background: #26276f; color: white; padding: 22px 28px; }
    .header h1 { margin: 0; font-size: 24px; }
    .header p { margin: 6px 0 0; opacity: .85; font-size: 14px; }
    .container { max-width: 980px; margin: 30px auto; padding: 0 18px; }
    .section-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
    .course-card { background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 22px; box-shadow: 0 3px 14px rgba(0,0,0,.06); }
    .course-title { font-size: 20px; font-weight: 700; color: #26276f; margin-bottom: 14px; }
    .course-info { display: grid; gap: 8px; font-size: 14px; margin-bottom: 18px; }
    .registered-box { display: inline-flex; align-items: center; gap: 8px; background: #eef0f8; color: #26276f; border-radius: 10px; padding: 9px 13px; font-weight: 700; margin-bottom: 18px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button { font: inherit; cursor: pointer; }
    .btn-secondary { padding: 10px 16px; border-radius: 9px; border: 1px solid #d1d5db; background: white; color: #374151; }
    .btn-primary { padding: 10px 18px; border-radius: 9px; border: none; background: #26276f; color: white; font-weight: 700; }
    .btn-primary:hover { background: #1d1e59; }
    .modal-overlay { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,.55); padding: 24px; align-items: center; justify-content: center; }
    .modal { width: min(900px, 100%); height: min(760px, 92vh); background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; }
    .modal-header { padding: 14px 18px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 16px; font-weight: 700; color: #26276f; }
    .close-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #d1d5db; background: #f9fafb; font-size: 20px; line-height: 1; }
    .form-frame { width: 100%; height: 100%; border: 0; flex: 1; }
    .empty-list { color: #6b7280; font-size: 14px; padding: 8px 0; }
  </style>
</head>
<body>

  <header class="header">
    <h1>HROD Training Registration</h1>
    <p>Sandbox สำหรับทดลองระบบลงทะเบียนอบรม</p>
  </header>

  <main class="container">
    <div class="section-title">หลักสูตรที่เปิดลงทะเบียน</div>

    <div class="course-card">
      <div class="course-title">BK401 - หลักสูตรทดลอง</div>

      <div class="course-info">
        <div>📅 วันที่ 21 ตุลาคม 2569</div>
        <div>🕘 เวลา 09:00 - 12:00 น.</div>
        <div>📍 ห้องประชุมสายรุ้ง ชั้น 5</div>
      </div>

      <div class="registered-box">
        👥 สมัครแล้ว <span id="registered-count">0</span> คน
      </div>

      <div class="actions">
        <button class="btn-secondary" onclick="showRegisteredList()">ดูรายชื่อผู้สมัคร</button>
        <button class="btn-primary" onclick="openRegistration()">ลงทะเบียน</button>
      </div>

      <div id="registered-list" class="empty-list" style="display:none;">
        ตอนนี้ยังไม่ได้เชื่อมข้อมูลรายชื่อผู้สมัคร
      </div>
    </div>
  </main>

  <div id="registration-modal" class="modal-overlay" onclick="closeOnBackdrop(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">ลงทะเบียนอบรม — BK401</div>
        <button class="close-btn" onclick="closeRegistration()" aria-label="ปิด">×</button>
      </div>

      <iframe
        class="form-frame"
        src="https://forms.cloud.microsoft/r/sEZnRRVWKZ?embed=true"
        frameborder="0"
        marginwidth="0"
        marginheight="0"
        allowfullscreen
        webkitallowfullscreen
        mozallowfullscreen
        msallowfullscreen>
      </iframe>
    </div>
  </div>

  <script>
    function openRegistration() {
      document.getElementById('registration-modal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeRegistration() {
      document.getElementById('registration-modal').style.display = 'none';
      document.body.style.overflow = '';
    }

    function closeOnBackdrop(event) {
      if (event.target.id === 'registration-modal') {
        closeRegistration();
      }
    }

    function showRegisteredList() {
      const el = document.getElementById('registered-list');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeRegistration();
    });
  </script>

</body>
</html>
